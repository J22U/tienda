<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso Admin | Trébol</title>
    <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/donc8a6tc/image/upload/v1770737717/LOGO_TR%C3%89BOL_o6dvfx.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a140e;
            --surface: #10201705;
            --card: #0f1e16;
            --card-line: rgba(232, 151, 30, 0.16);
            --grid-line: rgba(90, 140, 110, 0.09);
            --green: #2f9e63;
            --green-dim: #1f5c3f;
            --amber: #e8971e;
            --amber-soft: rgba(232, 151, 30, 0.14);
            --text: #eef2ea;
            --muted: #8ea391;
            --hairline: rgba(238, 242, 234, 0.10);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            background:
                radial-gradient(circle at 50% 18%, rgba(47, 158, 99, 0.16), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Blueprint grid backdrop */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at 50% 40%, black 5%, transparent 72%);
            pointer-events: none;
        }

        /* Faint diagonal hatch, like a technical elevation shading */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                115deg,
                rgba(232, 151, 30, 0.03) 0px,
                rgba(232, 151, 30, 0.03) 1px,
                transparent 1px,
                transparent 14px
            );
            pointer-events: none;
        }

        .wrap {
            position: relative;
            width: 100%;
            max-width: 420px;
            z-index: 1;
            margin: auto;
        }

        .tag-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0 4px 10px;
        }

        .tag-label .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px rgba(47, 158, 99, 0.9);
        }

        /* Card with technical-drawing corner brackets instead of a plain rounded box */
        .plate {
            position: relative;
            background: linear-gradient(180deg, #101f18 0%, #0c1811 100%);
            border: 1px solid var(--hairline);
            padding: 44px 38px 36px;
        }

        .plate::before,
        .plate::after,
        .corner-tl, .corner-br {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2px solid var(--amber);
            opacity: 0.85;
        }
        .plate::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .plate::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        .corner-tl { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-br { bottom: -1px; left: -1px; border-right: none; border-top: none; }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand .logo-glow {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f4faf6 55%, rgba(244, 250, 246, 0) 78%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px 6px rgba(255, 255, 255, 0.18);
        }

        .brand img {
            width: 62px;
            height: 62px;
            object-fit: contain;
        }

        .brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.55rem;
            margin: 0 0 6px;
            letter-spacing: -0.01em;
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .field {
            margin-bottom: 24px;
        }

        .field label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 10px;
        }

        .field input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--hairline);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 16px; /* evita zoom automático al enfocar en iOS */
            padding: 10px 2px 10px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 0;
            transition: border-color 0.2s ease;
        }

        .field input::placeholder {
            color: rgba(142, 163, 145, 0.55);
        }

        .field input:focus {
            border-bottom-color: var(--amber);
        }

        .btn-ingresar {
            width: 100%;
            margin-top: 8px;
            background: var(--amber);
            color: #1a1206;
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 15px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .btn-ingresar:hover {
            background: #f5a935;
        }

        .btn-ingresar:active {
            transform: scale(0.99);
        }

        .btn-ingresar svg {
            width: 15px;
            height: 15px;
            transition: transform 0.2s ease;
        }

        .btn-ingresar:hover svg {
            transform: translateX(3px);
        }

        .foot {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px dashed var(--hairline);
            text-align: center;
        }

        .foot p {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .foot a {
            color: var(--amber);
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .foot a:hover {
            border-bottom-color: var(--amber);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-ingresar, .btn-ingresar svg, .field input, .foot a {
                transition: none;
            }
        }

        @media (max-width: 480px) {
            body::before { background-size: 32px 32px; }
            .plate { padding: 32px 22px 26px; }
            .brand h1 { font-size: 1.32rem; }
            .brand .logo-glow { width: 76px; height: 76px; }
            .brand img { width: 50px; height: 50px; }
            .tag-label { font-size: 0.6rem; padding: 0 2px 8px; }
            .field { margin-bottom: 20px; }
            .btn-ingresar { padding: 16px 18px; }
        }

        @media (max-width: 340px) {
            .tag-label span:last-child { display: none; }
        }

        @media (min-width: 992px) {
            .wrap { max-width: 440px; }
            .plate { padding: 52px 44px 40px; }
        }
    </style>
</head>
<body>

    <div class="wrap">
        <div class="tag-label">
            <span><span class="dot"></span>TRÉBOL // PANEL-ADMIN</span>
            <span>REV. 01</span>
        </div>

        <div class="plate">
            <div class="corner-tl"></div>
            <div class="corner-br"></div>

            <div class="brand">
                <div class="logo-glow">
                    <img src="https://res.cloudinary.com/donc8a6tc/image/upload/v1770738241/LOGO_TR%C3%89BOL-removebg-preview_uyamlw.png" alt="Trébol">
                </div>
                <h1>Acceso Admin</h1>
                <p>Panel privado de administración de Trébol</p>
            </div>

            <form id="form-login-admin">
                <div class="field">
                    <label for="admin-email">Usuario</label>
                    <input type="text" id="admin-email" placeholder="admin" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="admin-password">Contraseña</label>
                    <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-ingresar">
                    Ingresar
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="foot">
                <p>Si necesitas volver a la tienda:</p>
                <a href="/tienda.html">Regresar a la tienda</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const BASE_URL = window.location.origin;

        document.getElementById('form-login-admin').addEventListener('submit', async function (e) {
            e.preventDefault();
            const user = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;

            try {
                const res = await fetch(`${BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Credenciales inválidas');
                }

                localStorage.setItem('admin_token', data.token);
                localStorage.setItem('admin_logged', 'true');

                Swal.fire({
                    title: '¡Login Exitoso!',
                    text: 'Redirigiendo al panel admin...',
                    icon: 'success',
                    timer: 1400,
                    didClose: () => {
                        window.location.replace('/admin');
                    }
                });
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        });
    </script>
</body>
</html>
