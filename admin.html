<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trébol | Panel de Control</title>
    <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/donc8a6tc/image/upload/v1770737717/LOGO_TR%C3%89BOL_o6dvfx.jpg">
    
    <!-- Bootstrap y iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/admin.css">
    
    <!-- Socket.io LOCAL (CSP-safe) -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- ✅ jsPDF CSP-SAFE CDN (jsdelivr.net only) -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.6.0/dist/jspdf.plugin.autotable.min.js"></script>
    
    <!-- OneSignal v16 (CSP now allows) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    
    <script>
        // ✅ Session validation moved to js/admin.js - cleaner architecture
        
        // Only basic protection here (detailed logic in js/admin.js)
        if (!localStorage.getItem('admin_logged')) {
            window.location.replace('tienda.html');
        }
    </script>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header-section d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center">
                <div class="logo-admin-container">
                    <img src="https://res.cloudinary.com/donc8a6tc/image/upload/v1770738241/LOGO_TR%C3%89BOL-removebg-preview_uyamlw.png" alt="Logo">
                </div>
                <div>
                    <h1>Administración TRÉBOL<span style="color:var(--accent)">.</span></h1>
                    <p class="text-muted fw-bold mb-0" style="font-size: 0.8rem;">Panel de gestión profesional</p>
                </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a href="tienda.html?view=store" class="btn btn-dark rounded-pill px-4 fw-bold btn-sm">
                    <i class="bi bi-shop me-2"></i> VER TIENDA
                </a>
                


                <button type="button" id="btn-logout" class="btn btn-danger rounded-pill px-4 fw-bold btn-sm" data-action="logout">
                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
                </button>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="row g-4">
            <!-- FORMULARIO -->
            <div class="col-lg-5">
                <div class="bento-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold m-0" id="titulo-form">Crear Producto</h4>
                        <button type="button" id="btn-nuevo" class="btn btn-light btn-sm fw-bold" data-action="limpiarForm">
                            <i class="bi bi-plus-lg"></i> NUEVO
                        </button>
                    </div>
                    
                    <form id="form-producto">
                        <input type="hidden" id="prod-id">
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre del Artículo</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej: Motosierra" required>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Marca</label>
                                <input type="text" id="marca" class="form-control" placeholder="Stihl" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">SKU</label>
                                <input type="text" id="sku" class="form-control" placeholder="Código">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Precio ($)</label>
                                <input type="number" id="precio" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Stock</label>
                                <input type="number" id="stock" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea id="caracteristicas" class="form-control" rows="2" placeholder="Detalles del producto..."></textarea>
                        </div>
                        
                        <div class="mb-4">
<label class="form-label">Imágenes (puedes seleccionar varias)</label>
<input type="file" id="imagenes" class="form-control" accept="image/*" multiple>
                        </div>
                        
                        <button type="submit" class="btn-main w-100" id="btn-guardar">GUARDAR PRODUCTO</button>
                    </form>
                </div>
            </div>

            <!-- GESTIÓN DE PRODUCTOS -->
            <div class="col-lg-7">
                <div class="bento-card">
                    <!-- TABS -->
                    <ul class="nav nav-pills mb-4 gap-2" id="adminTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-inventario" type="button" data-tab="inventario">
                                <i class="bi bi-box-seam me-2"></i>Inventario
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-agotados" type="button" data-tab="agotados">
                                <i class="bi bi-exclamation-triangle me-2"></i>Agotados
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-pedidos" type="button" data-tab="pedidos">
                                <i class="bi bi-cart-check me-2"></i>Pedidos
                            </button>
                        </li>
                        <li class="nav-item ms-md-auto d-flex align-items-center gap-2">
                            <button class="btn btn-outline-success btn-sm rounded-pill fw-bold px-3" 
                                    style="min-width: 120px;" 
id="btn-backup" data-action="exportar"
                                    title="Descargar copia de seguridad">
                                <i class="bi bi-cloud-arrow-down-fill me-2"></i>Backup
                            </button>

                            <button class="btn btn-outline-warning btn-sm rounded-pill fw-bold px-3" 
                                    style="min-width: 120px;" 
id="btn-importar" data-action="importar"
                                    title="Restaurar desde archivo">
                                <i class="bi bi-cloud-arrow-up-fill me-2"></i>Recuperar
                            </button>

                            <input type="file" id="inputImportar" accept=".json" style="display: none;">

                        </li>
                    </ul>

                    <!-- CONTENIDO TABS -->
                    <div class="tab-content">
                        <!-- TAB: INVENTARIO -->
                        <div class="tab-pane fade show active" id="tab-inventario">
                            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                                <h5 class="fw-bold m-0">Productos</h5>
                                <div class="input-group input-group-sm" style="max-width: 250px;">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                                    <input type="text" id="buscar-prod" class="form-control border-start-0 bg-light" placeholder="Filtrar por nombre o SKU..." data-action="filtrar">
                                </div>
                                <span class="badge bg-dark rounded-pill" id="total-count">0 items</span>
                            </div>
                            <div id="lista-productos"></div>
                        </div>

                        <!-- TAB: AGOTADOS -->
                        <div class="tab-pane fade" id="tab-agotados">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold m-0 text-danger">Stock Crítico</h5>
                                <span class="badge bg-danger rounded-pill" id="agotados-count">0 alertas</span>
                            </div>
                            <div id="lista-agotados"></div>
                        </div>

                        <!-- TAB: PEDIDOS -->
                        <div class="tab-pane fade" id="tab-pedidos">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold m-0">Historial de Ventas</h5>
                                <span class="badge bg-primary rounded-pill" id="order-count">0 recibidos</span>
                            </div>

                            <div class="d-flex gap-2 mb-4 p-2 bg-light rounded-4 justify-content-center shadow-sm">
<button class="btn btn-sm btn-dark rounded-pill px-3 fw-bold" id="btn-filtro-Todos" data-tab="Todos">
                                    TODOS
                                </button>
                                <button class="btn btn-sm btn-outline-warning rounded-pill px-3 fw-bold" data-tab="Pendiente">
                                    PENDIENTES
                                </button>
                                <button class="btn btn-sm btn-outline-success rounded-pill px-3 fw-bold" data-tab="Completado">
                                    COMPLETADOS
                                </button>
                            </div>

                            <div id="lista-pedidos"></div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
</div>

<!-- 🛒 MODAL DETALLES PEDIDO -->
<div class="modal fade" id="modalPedidoDetails" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Detalles Pedido <span id="modalPedidoNum"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-4">
          <div class="col-md-8">
            <h5><strong>Pedido #</strong><span id="modalPedidoNum"></span></h5>
            <p><strong>Cliente:</strong> <span id="modalCliente"></span></p>
            <p><strong>Fecha:</strong> <span id="modalFecha"></span> | <strong>Estado:</strong> <span id="modalEstado"></span></p>
            <p><strong>Tel:</strong> <span id="modalTelefono"></span> | <strong>Doc:</strong> <span id="modalDocumento"></span></p>
            <p><strong>Dir:</strong> <span id="modalDireccion"></span></p>
          </div>
          <div class="col-md-4 text-end">
            <h3 class="text-success" id="modalTotal"></h3>
          </div>
        </div>
        <div class="table-responsive mb-3">
          <table class="table table-hover" id="modalItemsTable">
            <thead class="table-dark">
              <tr>
                <th>Producto</th>
                <th>Cant.</th>
                <th>Precio</th>
                <th>Desc.</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="row">
          <div class="col">
            <div class="input-group input-group-sm">
              <span class="input-group-text">Descuento Pedido</span>
              <input type="number" id="modalDescuentoInput" class="form-control" placeholder="%" min="0" max="100">
              <span class="input-group-text text-muted small" id="totalPreview"></span>
              <button class="btn btn-warning btn-sm" id="modalDescuentoBtn">Aplicar</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="modalBtnFactura">
          <i class="bi bi-file-earmark-pdf"></i> Generar Factura
        </button>
      </div>
    </div>
  </div>
</div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Socket.io for real-time notifications -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- 🔔 ONESIGNAL v16 Fixed -->
    <script src="js/onesignal-v16-fixed.js" defer></script>
    
    <!-- CSP Event Delegation -->
    <script>
document.addEventListener('click', function(e) {
  if(e.target.matches('#btn-backup, [data-action="exportar"]')) return window.exportarInventario();
  if(e.target.matches('#btn-importar, [data-action="importar"]')) return document.getElementById('inputImportar').click();
  const tabTarget = e.target.closest('[data-tab="Pendiente"], [data-tab="Completado"], [data-tab="Todos"]');
  if(tabTarget && window.filtrarPedidos) return window.filtrarPedidos(tabTarget.dataset.tab);
});
    </script>
    <script src="js/product-delegation.js" defer></script>
    <script src="js/admin.js" defer></script>

</body>
</html>
